<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火山喷发 · Canvas 2D 粒子动画</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, #15111c 0%, #06050a 55%, #000 100%);
    overflow: hidden;
  }
  #volcano {
    width: min(960px, 97vw);
    height: auto;
    aspect-ratio: 960 / 540;
    display: block;
    border-radius: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06);
  }
</style>
</head>
<body>
<canvas id="volcano" width="960" height="540"></canvas>

</html>
