  option:

artalk:
  server:
  site:
  visitor: false
  option:

# ============================================================
# 聊天
# ============================================================
chat:
  use:                        # chatra/tidio/crisp，留空不启用
  rightside_button: false     # 右下角显示聊天按钮
  button_hide_show: false     # 滚动时隐藏/显示聊天按钮

chatra:
  id:

tidio:
  public_key:

crisp:
  website_id:

# ============================================================
# 统计分析
# ============================================================
baidu_analytics:              # 百度统计
google_analytics:             # Google Analytics
cloudflare_analytics:         # Cloudflare 分析
microsoft_clarity:            # Microsoft Clarity
umami_analytics:
  enable: false
  serverURL:
  script_name: script.js
  website_id:
  option:
  UV_PV:
    site_uv: false
    site_pv: false
    page_pv: false
    token:
google_tag_manager:
  tag_id:
  domain:

# ============================================================
# 广告
# ============================================================
google_adsense:
  enable: false
  auto_ads: true
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client:
  enable_page_level_ads: true

ad:
  index:                      # 首页广告（每三篇文章插入一次）
  aside:                      # 侧边栏广告
  post:                       # 文章底部广告

# ============================================================
# 站点验证
# ============================================================
site_verification:
  # - name: google-site-verification
  #   content: xxxxxx
  # - name: baidu-site-verification
  #   content: xxxxxxx

# ============================================================
# 美化 / 特效
# ============================================================
# 主题色（颜色值必须用双引号）
theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49b1f5"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

# 分类/标签页 UI
# index=与首页一致 default=与归档一致，留空=index
category_ui:
tag_ui:

# 标签卡片
tag_cards:
  enable: true
  default_img: /img/tag-default.png   # 无单独图片时的默认图
  # 格式：
  # 标签名:
  #   name: "显示名"
  #   description: "描述"
  #   img: "/图片路径"
  tags:
    mistake:
      name: "错题本"
      description: "我的数学错题本..."
      img: "/img/tag-mistake.jpg"
    # javascript:
    #   name: "JavaScript"
    #   description: "JavaScript programming language"
    #   img: "/img/javascript.png"

rounded_corners_ui: true      # UI 圆角
text_align_justify: false     # 两端对齐
mask:
  header: true                # 顶部图遮罩
  footer: true                # 页脚遮罩

# 加载动画
preloader:
  enable: false
  source: 1                   # 1=fullpage-loading 2=pace 进度条
  pace_css_url:               # pace 主题样式地址

enter_transitions: true       # 页面进入过渡动画
display_mode: light           # 默认显示模式：light/dark

# 文章内容美化
beautify:
  enable: false
  field: post                 # site/post
  title_prefix_icon:          # 标题前缀图标（如 '\f0c1'）
  title_prefix_icon_color:    # 图标颜色（如 '#F47466'）

# 字体
font:
  global_font_size:
  code_font_size:
  font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Lato, Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif"
  code_font_family:

blog_title_font:
  font_link:                  # 字体 CSS 链接
  font_family:

# 分隔线图标
hr_icon:
  enable: true
  icon:                       # Unicode 图标值，如 '\3423'
  icon_top:                   # 是否显示在顶部

# 打字机特效
activate_power_mode:
  enable: true
  colorful: true
  shake: true
  mobile: false

# ============================================================
# 背景特效
# ============================================================
# 丝带
canvas_ribbon:
  enable: false
  size: 150
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

# 飘动丝带
canvas_fluttering_ribbon:
  enable: true
  mobile: true

# 星空线条
canvas_nest:
  enable: false
  color: '0,0,255'
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false

# 鼠标点击烟花
fireworks:
  enable: true
  zIndex: 9999
  mobile: false

# 鼠标点击爱心
click_heart:
  enable: false
  mobile: false

# 鼠标点击文字
clickShowText:
  enable: false
  text:
    # - I
    # - LOVE
    # - YOU
  fontSize: 15px
  random: false
  mobile: false

# ============================================================
# 灯箱
# ============================================================
lightbox: medium_zoom

# ============================================================
# 标签插件
# ============================================================
# 系列文章
series:
  enable: false
  orderBy: 'title'            # title/date
  order: 1
  number: true

# ABC 乐谱
abcjs:
  enable: false
  per_page: true

# Mermaid 图表
mermaid:
  enable: true
  code_write: true          # 用代码块写 Mermaid
  theme:
    light: default
    dark: dark

# Chart.js 图表
chartjs:
  enable: false
  fontColor:
    light: 'rgba(0, 0, 0, 0.8)'
    dark: 'rgba(255, 255, 255, 0.8)'
  borderColor:
    light: 'rgba(0, 0, 0, 0.1)'
    dark: 'rgba(255, 255, 255, 0.2)'
  scale_ticks_backdropColor:
    light: 'transparent'
    dark: 'transparent'

# 提示框
note:
  style: flat                 # simple/modern/flat/disabled
  icons: true
  border_radius: 3
  light_bg_offset: 0

# ============================================================
# 其他
# ============================================================
# PJAX 无刷新跳转
pjax:
  enable: false
  exclude:
    # - /xxxxxx/

# 音乐播放器注入
aplayerInject:
  enable: false
  per_page: true

# 右下角提示
snackbar:
  enable: false
  position: bottom-left       # top-left/top-center/top-right/bottom-left/bottom-center/bottom-right
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

instantpage: false            # 预加载链接
lazyload:
  enable: false
  native: false               # 用浏览器原生懒加载
  field: site                 # site/post
  placeholder:
  blur: false

# PWA
pwa:
  enable: false
  manifest:
  apple_touch_icon:
  favicon_32_32:
  favicon_16_16:
  mask_icon:

# Open Graph
Open_Graph_meta:
  enable: true
  option:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:

# 结构化数据
structured_data:
  enable: false
  alternate_name:             # 站点别名，格式：['name1', 'name2']

css_prefix: true              # 自动加浏览器厂商前缀

# ============================================================
# 代码注入
# ============================================================
inject:
  head:
