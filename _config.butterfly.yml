# ============================================================
# 导航栏
# ============================================================
nav:
  logo: /img/ico.png          # 导航栏 logo
  display_title: true         # 显示站点标题
  display_post_title: true    # 文章页显示文章标题代替站点标题
  fixed: false                # 导航栏是否固定（滚动悬浮）

# 菜单
# 格式：名称: 路径 || 图标
# 二级菜单：名称||图标: 换行写子项
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  目录: /categories/ || fas fa-folder-open
  清单||fas fa-list:
    音乐: /music/ || fas fa-music
    影视: /movies/ || fas fa-video
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-heart

# ============================================================
# 代码块
# ============================================================
code_blocks:
  theme: darker               # 代码高亮主题
  macStyle: true              # Mac 风格窗口按钮
  height_limit: false         # 是否限制高度
  word_wrap: true             # 自动换行
  # 工具栏
  copy: true                  # 复制按钮
  language: true              # 语言标签
  shrink: false               # 折叠按钮
  fullpage: true              # 全屏按钮

# ============================================================
# 社交链接
# 格式：图标类名: 链接 || 名称 || 颜色
# ============================================================
social:
  fab fa-github: https://github.com/slfftz2011 || Github || '#24292e'
  fas fa-envelope: mailto:slfftz520@163.com || Email || '#4a7dbe'
  #fab fa-bilibili: https://space.bilibili.com/ || Bilibili || '#FB7299'
  fab fa-qq: https://wpa.qq.com/msgrd?v=3&uin=154449837&site=qq&menu=yes || QQ || '#12B7F5'
  fas fa-cube: https://modrinth.com/user/slfftz2011 || Modrinth || '#00AF5C'
  fas fa-plug: https://www.spigotmc.org/members/slfftz2011.2607658 || SpigotMC || '#ED8106'
  fas fa-box-open: https://hangar.papermc.io/slfftz2011 || Hangar || '#6B7280'

# ============================================================
# 图片设置
# ============================================================
favicon: /img/favicon.ico     # 网站图标
avatar:
  img: /img/butterfly-icon.png  # 头像
  effect: true                  # 头像旋转动画

disable_top_img: false        # 是否全局禁用顶部图
default_top_img: /img/index_img.png  # 默认顶部图（页面未单独设置时使用）
index_img: /img/index_img.png        # 首页顶部图
archive_img: /img/index_img.png      # 归档页顶部图
tag_img: /img/index_img.png          # 标签页顶部图（注意：是单个 tag 页）
tag_per_img:                         # 为每个标签单独设图（格式：- 标签名: 图片路径）
category_img: /img/index_img.png     # 分类页顶部图（注意：是单个 category 页）
category_per_img:                    # 为每个分类单独设图
footer_img: false                    # 页脚背景图（false 不启用）
background:                          # 网站背景（可填颜色或图片地址，留空不启用）

# 文章封面
cover:
  index_enable: true          # 首页显示封面
  aside_enable: true          # 侧边栏显示封面
  archives_enable: true       # 归档页显示封面
  default_cover:
    /img/cover.png            # 默认封面图（可写多个，随机取用）

# 图片加载失败时替换
error_img:
  flink: /img/friend_404.gif  # 友链页失败图
  post_page: /img/404.jpg     # 文章页失败图

# 简易 404 页面
error_404:
  enable: false
  subtitle: 'Page Not Found'
  background: /img/error-page.png

# 文章元信息
post_meta:
  page:                       # 首页
    date_type: created        # created/updated/both
    date_format: date         # date/relative
    categories: true          # 显示分类
    tags: false               # 显示标签
    label: true               # 显示"发表于/更新于"等标签文字
  post:                       # 文章页
    position: left            # left/center
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# ============================================================
# 首页设置
# ============================================================
index_site_info_top:          # 首页站点信息距顶部距离（如 300px/10%），留空默认
index_top_img_height:         # 首页顶部图高度（如 300px），留空默认

# 首页副标题
subtitle:
  enable: true                # 启用打字机效果副标题
  effect: true                # 打字机动画
  typed_option:               # 打字机参数，留空默认
  source: false               # 是否从外部数据源读取副标题
  sub:                        # 副标题内容（数组，可写多条）

index_layout: 3               # 首页布局：1/2/3/4/5/6/7

# 首页文章摘要
# 1=description 2=有描述用描述否则自动摘要 3=自动摘要 false=不显示
index_post_content:
  method: 3
  length: 500                 # 摘要字数（method=2/3 时生效）

# ============================================================
# 文章页设置
# ============================================================
toc:
  post: true                  # 文章页显示目录
  page: false                 # 普通页面显示目录
  number: true                # 显示章节编号
  expand: false               # 默认展开
  style_simple: false         # 简洁模式（仅文章页）
  scroll_percent: true        # 显示滚动进度

# 版权信息
post_copyright:
  enable: true
  decode: true                # 版权信息是否解码（防止被爬）
  author_href:                # 作者链接（留空用站点主页）
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 赞赏
reward:
  enable: false
  text:                       # 赞赏文字
  QR_code:                    # 二维码列表
    # - img: /img/wechat.jpg
    #   link:
    #   text: wechat
    # - img: /img/alipay.jpg
    #   link:
    #   text: alipay

# 文章编辑按钮
post_edit:
  enable: false
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/

# 相关文章
related_post:
  enable: true
  limit: 6                    # 显示数量
  date_type: created          # created/updated

# 上下篇
# 1=下一篇链接到旧文章 2=下一篇链接到新文章 false=关闭
post_pagination: 1

# 文章过期提醒
noticeOutdate:
  enable: false
  style: flat                 # simple/flat
  limit_day: 365              # 超过多少天提示
  position: top               # top/bottom
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# ============================================================
# 页脚
# ============================================================
footer:
  nav:                        # 页脚导航
  owner:
    enable: true
    since: 2025               # 建站年份
  copyright:
    enable: true
    version: true             # 显示主题/框架版本
  custom_text:                # 自定义文字

# ============================================================
# 侧边栏
# ============================================================
aside:
  enable: true
  hide: false                 # 默认是否隐藏
  button: true                # 显示切换按钮
  mobile: true                # 移动端显示
  position: right             # left/right
  display:
    archive: true             # 归档页显示侧边栏
    tag: true                 # 标签页显示
    category: true            # 分类页显示
  card_author:
    enable: true
    description:              # 作者描述
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/slfftz2011
  card_announcement:
    enable: true
    content: 欢迎来到我的博客！正在装修ing...
  card_recent_post:
    enable: true
    limit: 5
    sort: date                # date/updated
    sort_order:               # 留空默认
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    storage: 10
    avatar: true
  card_categories:
    enable: true
    limit: 8                  # 0=全部
    expand: none              # none/true/false
    sort_order:
  card_tags:
    enable: true
    limit: 40                 # 0=全部
    color: false              # 彩色标签
    orderby: random           # random/name/length
    order: 1                  # 1=升序 -1=降序
    sort_order:
  card_archives:
    enable: true
    type: monthly             # monthly/yearly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    series_title: false
    orderBy: 'date'           # title/date
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    runtime_date:             # 运行时长起始时间（如 1/1/2024 00:00:00），留空不启用

# ============================================================
# 右下角按钮
# ============================================================
rightside_bottom:             # 距底部距离（px）

# 简繁转换
translate:
  enable: false
  default: 繁
  defaultEncoding: 2          # 1=繁体 2=简体
  translateDelay: 0
  msgToTraditionalChinese: '繁'
  msgToSimplifiedChinese: '簡'

readmode: true                # 阅读模式

# 深色模式
darkmode:
  enable: true
  button: true                # 显示切换按钮
  # autoChangeMode: 1=跟随系统 2=按时间 6pm~6am false=关闭
  autoChangeMode: false
  start:                      # 深色开始时间（0~24），留空默认 6
  end:                        # 深色结束时间，留空默认 18

rightside_scroll_percent: false  # 回顶按钮显示滚动百分比

# 右下角按钮顺序
rightside_item_order:
  enable: false
  hide:                       # 默认隐藏：readmode,translate,darkmode,hideAside
  show:                       # 默认显示：toc,chat,comment

rightside_config_animation: true

# ============================================================
# 全局设置
# ============================================================
anchor:
  auto_update: false          # 滚动时更新 URL 锚点
  click_to_scroll: false      # 点击标题滚动并更新锚点

photofigcaption: false        # 图片自动加 figcaption

copy:
  enable: true
  copyright:
    enable: false
    limit_count: 150          # 超过多少字加版权

# 字数统计（需 hexo-wordcount 插件）
wordcount:
  enable: true
  post_wordcount: true        # 文章页显示字数
  min2read: true              # 显示阅读时长
  total_wordcount: true       # 侧边栏显示全站字数

# 不蒜子统计
busuanzi:
  site_uv: true               # 全站访客数
  site_pv: true               # 全站浏览量
  page_pv: true               # 单页浏览量

# ============================================================
# 数学公式
# ============================================================
math:
  use: mathjax                # mathjax/katex，留空不启用
  per_page: true              # true=每页都加载 false=按 front-matter 加载
  hide_scrollbar: false
  mathjax:
    enableMenu: true          # 右键菜单
    tags: none                # all/ams/none 公式编号
  katex:
    copy_tex: false           # 允许复制 KaTeX 公式

# ============================================================
# 搜索
# ============================================================
search:
  use: local_search                 # algolia_search/local_search/docsearch，留空不启用
  placeholder:                # 搜索框提示文字
  algolia_search:
    hitsPerPage: 6
  local_search:
    preload: false            # 预加载搜索数据
    top_n_per_article: 1      # 每篇显示前 n 条，-1=全部
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# ============================================================
# 分享
# ============================================================
share:
  use: sharejs                # sharejs/addtoany，留空不启用
  sharejs:
    sites: facebook,x,wechat,weibo,qq
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# ============================================================
# 评论系统
# 最多同时启用两个，第一个为默认
# 可选：Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
# ============================================================
comments:
  use:
  text: true                  # 评论按钮旁显示评论系统名
  lazyload: false             # 懒加载（会失效评论数）
  count: false                # 顶部图显示评论数
  card_post_count: false      # 首页卡片显示评论数

disqus:
  shortname:
  apikey:

disqusjs:
  shortname:
  apikey:
  option:

livere:
  uid:

gitalk:
